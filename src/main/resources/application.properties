spring.application.name=quick-commerce
# Database (matches docker-compose.yml)
spring.datasource.url=jdbc:postgresql://localhost:5432/quickcommerce
spring.datasource.username=qc
spring.datasource.password=qc

# JPA: Flyway owns the schema, Hibernate only checks it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Show the database check inside /actuator/health
management.endpoint.health.show-details=always
