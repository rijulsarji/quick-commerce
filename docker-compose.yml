services:
  postgres:
    image: postgres:17
    container_name: qc-postgres
    environment:
      POSTGRES_DB: quickcommerce
      POSTGRES_USER: qc
      POSTGRES_PASSWORD: qc
    ports:
      - "5432:5432"
    volumes:
      - qc-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qc -d quickcommerce"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  qc-pgdata: